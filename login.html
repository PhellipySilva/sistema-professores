<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Entrar · MatchPhoint</title>
    <link rel="icon" href="./assets/brand/matchphoint-mark.png" type="image/png" />
    <!-- PWA: sem o manifest e o Service Worker (js/offline/register-sw.js), o
         navegador nem executa JavaScript quando está offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MatchPhoint" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body class="app-booting">
    <main class="auth">
      <div class="auth__card">
        <div class="auth__brand">
          <img
            class="auth__brand-logo"
            src="./assets/brand/matchphoint.png"
            alt="MatchPhoint"
            width="440"
            height="214"
          />
          <p class="auth__brand-tagline">Gestão de aulas de Beach Tennis</p>
        </div>

        <h1 class="auth__title">Entrar</h1>
        <p class="auth__subtitle text-muted">Acesse com seu e-mail e senha.</p>

        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">E-mail</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              inputmode="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="password">Senha</label>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Sua senha"
              required
            />
          </div>

          <p class="field__error hidden" id="login-error" role="alert"></p>

          <button class="btn btn--primary btn--block" type="submit" id="login-submit">
            Entrar
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
