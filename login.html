<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Entrar · MatchPhoint</title>
    <link rel="icon" href="./assets/brand/matchphoint-mark.png" type="image/png" />
    <!-- PWA: sem o manifest e o Service Worker (js/offline/register-sw.js), o
         navegador nem executa JavaScript quando está offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MatchPhoint" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body class="app-booting">
    <main class="auth">
      <div class="auth__card">
        <div class="auth__brand">
          <img
            class="auth__brand-logo"
            src="./assets/brand/matchphoint.png"
            alt="MatchPhoint"
            width="440"
            height="214"
          />
          <p class="auth__brand-tagline">Gestão de aulas de Beach Tennis</p>
        </div>

        <h1 class="auth__title" id="auth-title">Entrar</h1>
        <p class="auth__subtitle text-muted" id="auth-subtitle">Acesse com seu e-mail e senha.</p>

        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">E-mail</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              inputmode="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="password">Senha</label>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Sua senha"
              required
            />
          </div>

          <p class="field__error hidden" id="login-error" role="alert"></p>

          <button class="btn btn--primary btn--block" type="submit" id="login-submit">
            Entrar
          </button>

          <!-- Dentro do form de propósito: o espaçamento entre os dois botões é
               o mesmo `gap` do formulário, sem estilo novo. type="button" não
               envia nada — só troca o formulário visível. -->
          <button class="btn btn--ghost btn--block" type="button" id="show-signup">
            Criar conta
          </button>
        </form>

        <!-- Cadastro. Mesmo cartão, mesmos componentes: o que muda é qual dos
             dois formulários está visível. -->
        <form class="form hidden" id="signup-form" novalidate>
          <div class="field">
            <label class="field__label" for="signup-name">Nome</label>
            <input
              class="input"
              type="text"
              id="signup-name"
              name="name"
              autocomplete="name"
              placeholder="Ex.: Phellipy Silva"
              required
            />
            <p class="field__hint">
              É por este nome que você aparece para os outros professores ao compartilhar um
              planejamento.
            </p>
          </div>

          <div class="field">
            <label class="field__label" for="signup-email">E-mail</label>
            <input
              class="input"
              type="email"
              id="signup-email"
              name="email"
              autocomplete="email"
              inputmode="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div class="field">
            <label class="field__label" for="signup-password">Senha</label>
            <input
              class="input"
              type="password"
              id="signup-password"
              name="password"
              autocomplete="new-password"
              placeholder="Ao menos 6 caracteres"
              minlength="6"
              required
            />
          </div>

          <p class="field__error hidden" id="signup-error" role="alert"></p>
          <p class="field__hint hidden" id="signup-notice" role="status"></p>

          <button class="btn btn--primary btn--block" type="submit" id="signup-submit">
            Criar conta
          </button>

          <button class="btn btn--ghost btn--block" type="button" id="show-login">
            Já tenho conta
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
