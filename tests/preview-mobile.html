<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Celular · pré-visualização</title>
    <style>
      body { margin: 0; padding: 16px; background: #d9dde5; font: 13px system-ui; display: flex; gap: 16px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 6px; font-weight: 600; color: #333; }
      iframe { border: 0; border-radius: 12px; background: #fff; box-shadow: 0 4px 16px rgb(0 0 0 / 20%); }
    </style>
  </head>
  <body>
    <figure>
      <figcaption id="cap-a">390 px — conteúdo</figcaption>
      <iframe id="a" width="390" height="1240" src="/tests/preview.html"></iframe>
    </figure>
    <figure>
      <figcaption id="cap-b">390 px — menu aberto</figcaption>
      <iframe id="b" width="390" height="1240" src="/tests/preview.html?menu=1"></iframe>
    </figure>
    <figure>
      <figcaption id="cap-c">320 px — tela mínima</figcaption>
      <iframe id="c" width="320" height="1240" src="/tests/preview.html"></iframe>
    </figure>
    <!-- O painel do sino é o que mais arrisca estourar a largura no celular: ele
         nasce pendurado num botão que está longe da borda direita. -->
    <figure>
      <figcaption id="cap-d">360 px — sino aberto</figcaption>
      <iframe id="d" width="360" height="1240" src="/tests/preview.html?sino=1"></iframe>
    </figure>

    <script type="module">
      /* Mede o scroll horizontal DENTRO de cada iframe: é o único jeito de
         testar 320 px, porque o Chrome headless trava o viewport em 485. */
      window.addEventListener('load', () => {
        setTimeout(() => {
          const linhas = [];
          for (const id of ['a', 'b', 'c', 'd']) {
            const frame = document.getElementById(id).contentDocument;
            const doc = frame.documentElement;
            const sobra = doc.scrollWidth - doc.clientWidth;

            /* Elemento `fixed` que sai da tela NÃO entra no scrollWidth: ele
               simplesmente fica cortado, sem barra de rolagem para denunciar.
               Foi assim que o painel do sino apareceu torto no celular — daí
               esta segunda medição, que olha os dois lados. */
            /* Barra que rola de propósito (o filtro por dia da semana) tem
               filhos além da borda por desenho — só conta quem vaza da TELA. */
            const dentroDeUmRolador = (node) => {
              for (let p = node.parentElement; p && p !== frame.body; p = p.parentElement) {
                const ox = frame.defaultView.getComputedStyle(p).overflowX;
                if (ox === 'auto' || ox === 'scroll') return true;
              }
              return false;
            };

            const vazando = [];
            for (const node of frame.querySelectorAll('body *')) {
              const estilo = frame.defaultView.getComputedStyle(node);
              if (estilo.visibility === 'hidden' || estilo.display === 'none') continue;

              const r = node.getBoundingClientRect();
              if (r.width === 0) continue;
              if (r.right <= doc.clientWidth + 1 && r.left >= -1) continue;
              if (dentroDeUmRolador(node)) continue;

              vazando.push(`${node.tagName}.${String(node.className).split(' ')[0]}@${Math.round(r.left)}..${Math.round(r.right)}`);
            }

            linhas.push(`${id}:${doc.clientWidth}px sobra=${sobra} fora=${vazando.length}`);

            const cap = document.getElementById(`cap-${id}`);
            if (sobra > 0) cap.textContent += ` ⚠ ESTOURA ${sobra}px`;
            else if (vazando.length > 0) cap.textContent += ` ⚠ ${vazando.length} FORA DA TELA`;
            else cap.textContent += ' ✓ tudo dentro da tela';

            if (vazando.length > 0) linhas.push(`>> ${vazando.slice(0, 5).join(' , ')}`);
          }
          document.title = linhas.join(' | ');
        }, 1200);
      });
    </script>
  </body>
</html>
